---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slipway-db
  namespace: slipway
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slipway
  namespace: slipway
  labels:
    app.kubernetes.io/name: slipway
spec:
  replicas: 1
  # SQLite is a single writer — never run two. Recreate stops the rollout from
  # briefly having an old and a new pod both holding the database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slipway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slipway
    spec:
      serviceAccountName: slipway
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532        # distroless "nonroot" uid/gid — so the PVC is writable
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: slipway
          image: ghcr.io/jtarleton/slipway@sha256:4e03c1f8ba598991beb6943e9ca14f48d99480cac3f858023478fff67eabbc19  # :f67bb96
          args:
            - serve
            - -addr=:8080
            - -db=/data/slipway.db
          env:
            # user:password for HTTP Basic auth on the whole UI. Required —
            # slipway is reachable from outside the cluster and can deploy,
            # roll back, and exec into containers.
            - name: SLIPWAY_AUTH
              valueFrom:
                secretKeyRef:
                  name: slipway
                  key: auth
            - name: SLIPWAY_RELEASE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slipway
                  key: release-token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: db
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: http }   # /healthz is exempt from basic auth
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: slipway-db
---
apiVersion: v1
kind: Service
metadata:
  name: slipway
  namespace: slipway
spec:
  selector:
    app.kubernetes.io/name: slipway
  # NodePort, like the Drupal sites — reachable at <node>:30090. The UI is
  # gated by SLIPWAY_AUTH (HTTP Basic); put it behind Cloudflare (or the node's
  # firewall) if you want TLS and to keep it off the open internet.
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30090
